name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options:
          - smoke
          - regression
        default: smoke

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      HEADLESS: true
      EXPLICIT_WAIT_MS:60000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Choose suite
        id: suite
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=regression" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=smoke" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "name=full" >> "$GITHUB_OUTPUT"
          else
            echo "name=smoke" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ${{ steps.suite.outputs.name }} suite
        run: npm run test:${{ steps.suite.outputs.name }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ steps.suite.outputs.name }}
          path: |
            playwright-report/
            test-results/
            logs/
          retention-days: 30
